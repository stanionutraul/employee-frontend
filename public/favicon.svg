<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 44 44">

    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect
        x="0"
        y="0"
        width="44"
        height="44"
        rx="14"
        fill="url(#grad)"
    />

    <!-- Dumbbell -->
    <g
        stroke="white"
        stroke-width="2.3"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none">

        <line x1="15" y1="22" x2="29" y2="22"/>

        <line x1="12" y1="16" x2="12" y2="28"/>
        <line x1="15" y1="17" x2="15" y2="27"/>

        <line x1="29" y1="17" x2="29" y2="27"/>
        <line x1="32" y1="16" x2="32" y2="28"/>

    </g>

</svg>